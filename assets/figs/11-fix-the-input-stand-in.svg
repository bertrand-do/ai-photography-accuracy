<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560"><style>.fig svg{ max-width:100%; height:auto; display:block; margin:0 auto; }
.figcap{ font:500 10.5px "IBM Plex Mono",Menlo,monospace; letter-spacing:.1em; text-transform:uppercase; color:#8B867B; padding:6px 0 4px; }
svg .lbl{ font:500 11px "IBM Plex Mono",Menlo,monospace; letter-spacing:.06em; fill:#6B6459; }
svg .lblup{ font:500 10px "IBM Plex Mono",Menlo,monospace; letter-spacing:.1em; fill:#6B6459; text-transform:uppercase; }
svg .lblink{ fill:#1A1A1A; }
svg .lblacc{ fill:#7C3AED; }
svg .lblbad{ fill:#9F2D20; }
svg .lblgood{ fill:#2F6B3F; }
svg .hand{ font-family:"Instrument Serif",Georgia,serif; font-style:italic; font-size:14px; fill:#1A1A1A; }
svg .ink{ stroke:#1A1A1A; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
svg .thin{ stroke:#1A1A1A; fill:none; stroke-width:1.2; stroke-linecap:round; }
svg .acc{ stroke:#8B5CF6; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
svg .accthin{ stroke:#8B5CF6; fill:none; stroke-width:1.5; stroke-linecap:round; }
svg .bad{ stroke:#9F2D20; fill:none; stroke-width:2.5; stroke-linecap:round; }
svg .dash{ stroke-dasharray:5 5; }
svg .dots{ stroke-dasharray:1.5 5; }
svg .paperfill{ fill:#EDEBE6; }
svg .accfill{ fill:#8B5CF6; }
svg .whitefill{ fill:#fff; }
.tao .stanza .acc{ color:#8B5CF6; }</style><rect x="0" y="0" width="560" height="160" fill="#FBFAF7" rx="12"/>
      <!-- small blurry -->
      <rect x="50" y="50" width="44" height="44" rx="4" class="bad dash"/>
      <circle cx="72" cy="72" r="10" class="thin" opacity=".35"/>
      <text x="34" y="116" class="lblup lblbad">tiny + blurry input</text>
      <text x="42" y="132" class="lblup lblbad">= invented details</text>
      <path d="M130 72 L186 72" class="acc"/><path d="M179 66 L188 72 L179 78" class="acc"/>
      <!-- big sharp -->
      <rect x="200" y="24" width="96" height="96" rx="6" class="acc whitefill"/>
      <circle cx="248" cy="72" r="26" class="ink"/>
      <circle cx="248" cy="72" r="15" class="thin"/>
      <line x1="248" y1="46" x2="248" y2="34" class="thin"/>
      <text x="200" y="140" class="lblup lblgood">big + clean input</text>
      <!-- phone standin -->
      <rect x="382" y="30" width="46" height="84" rx="8" class="ink whitefill"/>
      <circle cx="405" cy="102" r="5" class="thin"/>
      <rect x="390" y="40" width="30" height="50" rx="3" class="thin"/>
      <circle cx="405" cy="58" r="8" class="thin"/>
      <path d="M397 74 Q405 80 413 74" class="thin"/>
      <text x="356" y="140" class="lblup">no photo? shoot one.</text>
      <text x="448" y="60" class="hand">anyone can</text>
      <text x="448" y="78" class="hand">wear it for</text>
      <text x="448" y="96" class="hand">30 seconds</text>
    </svg>