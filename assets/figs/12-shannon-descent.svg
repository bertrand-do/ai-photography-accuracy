      <rect x="30" y="24" width="130" height="100" rx="6" class="ink whitefill"/>
      <g class="thin"><path d="M40 114 L60 90 L80 108"/><rect x="96" y="44" width="30" height="22" rx="2"/><ellipse cx="70" cy="60" rx="16" ry="7"/><line x1="40" y1="36" x2="70" y2="36"/></g>
      <rect x="92" y="82" width="34" height="26" rx="3" class="bad"/>
      <path d="M96 86 L122 104 M122 86 L96 104" class="bad"/>
      <text x="30" y="142" class="lblup lblbad">whole scene fails</text>
      <path d="M172 74 L216 74" class="acc"/><path d="M209 68 L218 74 L209 80" class="acc"/>
      <!-- isolated -->
      <rect x="230" y="44" width="70" height="60" rx="6" class="acc whitefill"/>
      <rect x="248" y="60" width="34" height="26" rx="3" class="ink"/>
      <path d="M240 118 l7 8 l13 -15" class="acc" transform="translate(4,-16)"/>
