<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 175" width="560"><style>.fig svg{ max-width:100%; height:auto; display:block; margin:0 auto; }
.figcap{ font:500 10.5px "IBM Plex Mono",Menlo,monospace; letter-spacing:.1em; text-transform:uppercase; color:#8B867B; padding:6px 0 4px; }
svg .lbl{ font:500 11px "IBM Plex Mono",Menlo,monospace; letter-spacing:.06em; fill:#6B6459; }
svg .lblup{ font:500 10px "IBM Plex Mono",Menlo,monospace; letter-spacing:.1em; fill:#6B6459; text-transform:uppercase; }
svg .lblink{ fill:#1A1A1A; }
svg .lblacc{ fill:#7C3AED; }
svg .lblbad{ fill:#9F2D20; }
svg .lblgood{ fill:#2F6B3F; }
svg .hand{ font-family:"Instrument Serif",Georgia,serif; font-style:italic; font-size:14px; fill:#1A1A1A; }
svg .ink{ stroke:#1A1A1A; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
svg .thin{ stroke:#1A1A1A; fill:none; stroke-width:1.2; stroke-linecap:round; }
svg .acc{ stroke:#8B5CF6; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
svg .accthin{ stroke:#8B5CF6; fill:none; stroke-width:1.5; stroke-linecap:round; }
svg .bad{ stroke:#9F2D20; fill:none; stroke-width:2.5; stroke-linecap:round; }
svg .dash{ stroke-dasharray:5 5; }
svg .dots{ stroke-dasharray:1.5 5; }
svg .paperfill{ fill:#EDEBE6; }
svg .accfill{ fill:#8B5CF6; }
svg .whitefill{ fill:#fff; }
.tao .stanza .acc{ color:#8B5CF6; }</style><rect x="0" y="0" width="560" height="175" fill="#FBFAF7" rx="12"/>
      <!-- control -->
      <rect x="34" y="30" width="96" height="90" rx="8" class="ink whitefill"/>
      <g class="thin"><line x1="48" y1="50" x2="116" y2="50"/><line x1="48" y1="66" x2="116" y2="66"/><line x1="48" y1="82" x2="116" y2="82"/><line x1="48" y1="98" x2="108" y2="98"/></g>
      <text x="34" y="140" class="lblup lblink">control (frozen)</text>
      <!-- variants -->
      <g>
        <rect x="180" y="14" width="96" height="44" rx="8" class="thin"/>
        <line x1="194" y1="28" x2="262" y2="28" class="thin"/><rect x="194" y="38" width="40" height="8" rx="3" class="accfill"/>
        <text x="286" y="42" class="lbl lblbad">✗</text>
      </g>
      <g>
        <rect x="180" y="66" width="96" height="44" rx="8" class="acc"/>
        <line x1="194" y1="80" x2="262" y2="80" class="thin"/><rect x="194" y="90" width="60" height="8" rx="3" class="accfill"/>
        <text x="284" y="96" class="lbl lblgood">✓</text>
      </g>
      <g>
        <rect x="180" y="118" width="96" height="44" rx="8" class="thin"/>
        <line x1="194" y1="132" x2="262" y2="132" class="thin"/><rect x="194" y="142" width="24" height="8" rx="3" class="accfill"/>
        <text x="286" y="148" class="lbl lblbad">✗</text>
      </g>
      <text x="180" y="12" class="lblup">each variant: ONE change (purple)</text>
      <path d="M310 88 L370 88" class="acc"/><path d="M362 82 L372 88 L362 94" class="acc"/>
      <!-- champion -->
      <rect x="384" y="44" width="110" height="90" rx="8" class="acc whitefill"/>
      <g class="thin"><line x1="398" y1="66" x2="480" y2="66"/><rect x="398" y="78" width="60" height="8" rx="3" class="accfill"/><line x1="398" y1="98" x2="480" y2="98"/><line x1="398" y1="112" x2="470" y2="112"/></g>
      <text x="384" y="152" class="lblup lblacc">new champion</text>
    </svg>